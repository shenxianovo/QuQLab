# registry.shenxianovo.com — ghcr.io pull-through cache 反代到本机 registry(127.0.0.1:5000)

# HTTP -> HTTPS
server {
    listen 80;
    server_name registry.shenxianovo.com;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name registry.shenxianovo.com;

    ssl_certificate /etc/letsencrypt/live/shenxianovo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shenxianovo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 镜像 layer 可能很大，关闭请求体大小限制
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 大 layer 回源 ghcr 可能慢，放宽超时
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
